<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тебе письмо 💗</title>
</head>
<body style="margin:0;padding:0;background:#fdeef2;">

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
       style="background:#fdeef2;padding:34px 12px;">
  <tr><td align="center">

    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="max-width:560px;background:#ffffff;border:1px solid #ffb8ce;
                  border-radius:4px;overflow:hidden;
                  box-shadow:0 16px 50px rgba(139,28,51,.18);
                  font-family:Georgia,'Playfair Display',serif;">

      <!-- Верхние полосы -->
      <tr><td align="center"
              style="padding:26px 20px 18px;
                     background:repeating-linear-gradient(
                       90deg,#fdeef2 0px,#fdeef2 22px,
                       #f8d5e0 22px,#f8d5e0 44px);">

        <div style="font-size:10px;letter-spacing:.42em;text-transform:uppercase;
                    color:#8b1c33;font-weight:bold;padding-bottom:10px;">
          Девичник у Саши намечается
        </div>

        <div style="font-family:Georgia,serif;font-weight:900;
                    font-size:44px;line-height:.92;color:#8b1c33;
                    letter-spacing:-.02em;text-transform:uppercase;">
          BACHELORETTE
        </div>

        <div style="font-family:'Great Vibes','Brush Script MT',cursive;
                    font-size:40px;line-height:1;color:#d92048;
                    margin-top:-8px;">
          Party!
        </div>

        <!-- Мини-гирлянда -->
        <div style="padding-top:14px;line-height:0;">
          <svg viewBox="0 0 400 28" width="340" height="24" style="max-width:100%;">
            <path d="M0 4 Q 200 16 400 4" stroke="#8b1c33" stroke-width="1" fill="none"/>
            <g fill="#d92048">
              <polygon points="24,7 36,7 30,20"/>
              <polygon points="64,9 76,9 70,22"/>
              <polygon points="104,11 116,11 110,24"/>
              <polygon points="144,12 156,12 150,25"/>
              <polygon points="184,12 196,12 190,25"/>
              <polygon points="224,12 236,12 230,25"/>
              <polygon points="264,11 276,11 270,24"/>
              <polygon points="304,9 316,9 310,22"/>
              <polygon points="344,7 356,7 350,20"/>
            </g>
          </svg>
        </div>
      </td></tr>

      <!-- Приветствие -->
      <tr><td align="center" style="padding:30px 30px 8px;">
        <div style="font-size:22px;color:#8b1c33;font-weight:bold;">
          Александра, привет!
        </div>
      </td></tr>

      <tr><td align="center" style="padding:0 30px 26px;">
        <div style="font-size:15px;line-height:1.65;color:#5d1024;opacity:.85;
                    font-family:Georgia,serif;font-style:italic;">
          У меня для тебя кое-что есть.
          Только не открывай сразу — сначала нажми на коробочку 👇
        </div>
      </td></tr>

      <!-- Кнопка-коробочка -->
      <tr><td align="center" style="padding:0 30px 30px;">
        <a href="https://elllshk22.github.io/devichnik/" target="_blank"
           style="text-decoration:none;display:inline-block;">
          <table role="presentation" cellpadding="0" cellspacing="0" border="0"
                 style="background:#d92048;border-radius:20px;
                        box-shadow:0 12px 30px rgba(139,28,51,.42);">
            <tr>
              <td align="center"
                  style="padding:22px 40px;font-size:44px;line-height:1;color:#ffffff;
                         font-family:Arial,sans-serif;">
                🎁
              </td>
            </tr>
          </table>
          <div style="font-family:Georgia,serif;font-size:13px;font-weight:bold;
                      color:#8b1c33;padding-top:14px;letter-spacing:.08em;
                      text-transform:uppercase;">
            нажми на коробочку
          </div>
        </a>
      </td></tr>

      <!-- Разделитель -->
      <tr><td align="center" style="padding:0 30px 14px;">
        <div style="height:1px;background:#ffb8ce;width:60%;margin:0 auto;"></div>
      </td></tr>

      <!-- Дата и место -->
      <tr><td align="center" style="padding:0 30px 12px;">
        <div style="font-size:12px;color:#8b1c33;letter-spacing:.24em;
                    text-transform:uppercase;font-weight:bold;opacity:.7;">
          17 октября · 16:00 · Казань
        </div>
      </td></tr>

      <tr><td align="center" style="padding:0 30px 26px;">
        <div style="font-size:12px;color:#a41e3e;font-style:italic;opacity:.7;">
          письмо откроется в браузере 💌
        </div>
      </td></tr>

      <!-- Нижние полосы -->
      <tr><td align="center"
              style="padding:14px 20px;
                     background:repeating-linear-gradient(
                       90deg,#fdeef2 0px,#fdeef2 22px,
                       #f8d5e0 22px,#f8d5e0 44px);">
        <div style="font-size:11px;color:#8b1c33;letter-spacing:.2em;
                    text-transform:uppercase;opacity:.75;">
          с любовью, твои любимки 💗
        </div>
      </td></tr>

    </table>

  </td></tr>
</table>

</body>
</html>
